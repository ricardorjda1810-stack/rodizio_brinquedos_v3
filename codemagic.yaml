workflows:
  signalflow-ci:
    name: SignalFlow CI
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Pub get
        script: |
          cd alerta_de_crise
          flutter pub get

      - name: Analyze
        script: |
          cd alerta_de_crise
          flutter analyze

      - name: Test
        script: |
          cd alerta_de_crise
          flutter test

      - name: Build iOS release
        script: |
          cd alerta_de_crise
          flutter build ios --release --no-codesign

  signalflow-testflight:
    name: SignalFlow TestFlight
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: asc_rodizio_v3

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.signalflow.app

    scripts:
      - name: Clean Flutter and iOS cache
        script: |
          cd alerta_de_crise
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Get packages
        script: |
          cd alerta_de_crise
          flutter pub get

      - name: Install pods
        script: |
          cd alerta_de_crise/ios
          pod install --repo-update

      - name: Use provisioning profiles
        script: |
          cd alerta_de_crise
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist=/Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging

      - name: Analyze
        script: |
          cd alerta_de_crise
          flutter analyze

      - name: Test
        script: |
          cd alerta_de_crise
          flutter test

      - name: Build IPA
        script: |
          cd alerta_de_crise
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

      - name: Locate IPA
        script: |
          find "$CM_BUILD_DIR/alerta_de_crise/build/ios" -name "*.ipa" -print

    artifacts:
      - $CM_BUILD_DIR/alerta_de_crise/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/alerta_de_crise/build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  production:
    name: Production
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: asc_rodizio_v3

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rodiziobrinquedos.v3

    scripts:
      - name: Clean Flutter and iOS cache
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

      - name: Pub get
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist=/Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging

      - name: Analyze
        script: flutter analyze --no-pub lib test

      - name: Test
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests directory found. Skipping flutter test."
          fi

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload Crashlytics dSYMs
        script: |
          set -e

          UPLOAD_SYMBOLS="ios/Pods/FirebaseCrashlytics/upload-symbols"
          GOOGLE_SERVICE_PLIST="ios/Runner/GoogleService-Info.plist"
          DSYM_LIST="$(mktemp)"

          echo "Crashlytics upload-symbols: $UPLOAD_SYMBOLS"
          echo "GoogleService-Info.plist: $GOOGLE_SERVICE_PLIST"

          if [ ! -f "$UPLOAD_SYMBOLS" ]; then
            echo "ERROR: Firebase Crashlytics upload-symbols not found at $UPLOAD_SYMBOLS"
            echo "Available FirebaseCrashlytics files:"
            find ios/Pods -maxdepth 4 -iname "*Crashlytics*" -print || true
            exit 1
          fi

          if [ ! -x "$UPLOAD_SYMBOLS" ]; then
            echo "ERROR: upload-symbols exists but is not executable."
            ls -l "$UPLOAD_SYMBOLS"
            exit 1
          fi

          if [ ! -f "$GOOGLE_SERVICE_PLIST" ]; then
            echo "ERROR: GoogleService-Info.plist not found at $GOOGLE_SERVICE_PLIST"
            exit 1
          fi

          echo "Inspecting iOS build output:"
          find build/ios -maxdepth 5 \( -name "*.xcarchive" -o -name "*.dSYM" -o -name "*.ipa" \) -print 2>/dev/null || true

          : > "$DSYM_LIST"
          for path in \
            build/ios/archive/*.xcarchive/dSYMs \
            build/ios/archive/Runner.xcarchive/dSYMs \
            build/ios/ipa \
            build/ios/Release-iphoneos
          do
            if [ -d "$path" ]; then
              find "$path" -type d -name "*.dSYM" -print >> "$DSYM_LIST"
            fi
          done

          sort -u "$DSYM_LIST" -o "$DSYM_LIST"

          if [ ! -s "$DSYM_LIST" ]; then
            echo "ERROR: No dSYM bundles found after flutter build ipa."
            echo "Full build/ios tree for diagnostics:"
            find build/ios -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi

          echo "Found dSYMs:"
          cat "$DSYM_LIST"

          while IFS= read -r dsym; do
            echo "Uploading dSYM: $dsym"
            "$UPLOAD_SYMBOLS" -gsp "$GOOGLE_SERVICE_PLIST" -p ios "$dsym"
          done < "$DSYM_LIST"

          rm -f "$DSYM_LIST"
          echo "Crashlytics dSYM upload finished."

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/archive/**/*.dSYM
      - build/ios/Release-iphoneos/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

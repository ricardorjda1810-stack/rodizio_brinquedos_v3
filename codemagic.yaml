workflows:
  signalflow-ci:
    name: SignalFlow CI
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Pub get
        script: |
          cd alerta_de_crise
          flutter pub get

      - name: Analyze
        script: |
          cd alerta_de_crise
          flutter analyze

      - name: Test
        script: |
          cd alerta_de_crise
          flutter test

      - name: Build iOS release
        script: |
          cd alerta_de_crise
          flutter build ios --release --no-codesign

  signalflow-testflight:
    name: SignalFlow TestFlight
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: asc_rodizio_v3

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.signalflow.app

    scripts:
      - name: Clean Flutter and iOS cache
        script: |
          cd alerta_de_crise
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Get packages
        script: |
          cd alerta_de_crise
          flutter pub get

      - name: Install pods
        script: |
          cd alerta_de_crise/ios
          pod install --repo-update

      - name: Use provisioning profiles
        script: |
          cd alerta_de_crise
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist=/Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging

      - name: Analyze
        script: |
          cd alerta_de_crise
          flutter analyze

      - name: Test
        script: |
          cd alerta_de_crise
          flutter test

      - name: Build IPA
        script: |
          cd alerta_de_crise
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

      - name: Locate IPA
        script: |
          find "$CM_BUILD_DIR/alerta_de_crise/build/ios" -name "*.ipa" -print

    artifacts:
      - $CM_BUILD_DIR/alerta_de_crise/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/alerta_de_crise/build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  production:
    name: Production
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: asc_rodizio_v3

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rodiziobrinquedos.v3

    scripts:
      - name: Clean Flutter and iOS cache
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

      - name: Pub get
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Analyze
        script: flutter analyze --no-pub lib test

      - name: Test
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests directory found. Skipping flutter test."
          fi

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

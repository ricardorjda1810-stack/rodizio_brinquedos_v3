workflows:
  signalflow-ci:
    name: SignalFlow CI
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Pub get
        script: |
          cd alerta_de_crise
          flutter pub get

      - name: Analyze
        script: |
          cd alerta_de_crise
          flutter analyze

      - name: Test
        script: |
          cd alerta_de_crise
          flutter test

      - name: Build iOS release
        script: |
          cd alerta_de_crise
          flutter build ios --release --no-codesign

  signalflow-testflight:
    name: SignalFlow TestFlight
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: asc_rodizio_v3

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.signalflow.app

    scripts:
      - name: Clean Flutter and iOS cache
        script: |
          cd alerta_de_crise
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ~/Library/Developer/Xcode/DerivedData/*

      - name: Get packages
        script: |
          cd alerta_de_crise
          flutter pub get

      - name: Install pods
        script: |
          cd alerta_de_crise/ios
          pod install --repo-update

      - name: Use provisioning profiles
        script: |
          cd alerta_de_crise
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist=/Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging

      - name: Analyze
        script: |
          cd alerta_de_crise
          flutter analyze

      - name: Test
        script: |
          cd alerta_de_crise
          flutter test

      - name: Build IPA
        script: |
          cd alerta_de_crise
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

      - name: Locate IPA
        script: |
          find "$CM_BUILD_DIR/alerta_de_crise/build/ios" -name "*.ipa" -print

    artifacts:
      - $CM_BUILD_DIR/alerta_de_crise/build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/alerta_de_crise/build/ios/archive/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-release:
    name: Android Release AAB
    instance_type: mac_mini_m2

    environment:
      flutter: '3.41.5'

    scripts:
      - name: Debug Android Gradle config
        script: |
          pwd
          git rev-parse HEAD
          git log --oneline -5
          flutter --version
          java -version
          cd android
          ./gradlew --version
          cd ..
          echo "---- android/gradle.properties ----"
          cat android/gradle.properties
          echo "---- android/settings.gradle.kts ----"
          sed -n '1,220p' android/settings.gradle.kts
          echo "---- android/build.gradle.kts ----"
          sed -n '1,220p' android/build.gradle.kts
          echo "---- android/app/build.gradle.kts ----"
          sed -n '1,260p' android/app/build.gradle.kts
          echo "---- grep android.newDsl ----"
          grep -R "android.newDsl" -n android || true

      - name: Clean Android build caches
        script: |
          rm -rf build
          rm -rf .dart_tool/flutter_build
          rm -rf ~/.gradle/caches/modules-2/files-2.1/com.android.tools.build/gradle
          flutter clean

      - name: Pub get
        script: flutter pub get

      - name: Analyze
        script: flutter analyze --no-pub lib test

      - name: Test
        script: flutter test

      - name: Set up Android release signing
        script: |
          set -e

          : "${CM_KEYSTORE:?Missing CM_KEYSTORE secret with the base64-encoded Android upload keystore.}"
          : "${CM_KEYSTORE_PASSWORD:?Missing CM_KEYSTORE_PASSWORD secret.}"
          : "${CM_KEY_ALIAS:?Missing CM_KEY_ALIAS secret.}"
          : "${CM_KEY_PASSWORD:?Missing CM_KEY_PASSWORD secret.}"

          mkdir -p android/app
          printf "%s" "$CM_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Android release signing files created for this build."
          ls -lh android/app/upload-keystore.jks

      - name: Build Android app bundle
        script: |
          if ! flutter build appbundle --release --android-project-arg=-Pandroid.newDsl=false; then
            echo "flutter build appbundle failed. Running Gradle with stacktrace for diagnostics."
            cd android
            ./gradlew :app:bundleRelease -Pandroid.newDsl=false --stacktrace --info
            cd ..
          fi

      - name: Locate AAB
        script: |
          echo "Searching for generated AAB files..."
          find . -name "*.aab" -print -exec ls -lh {} \;

          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB found at Flutter output path."
            ls -lh build/app/outputs/bundle/release/app-release.aab
          elif [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "AAB found at Android Gradle output path. Copying to Flutter artifact path."
            mkdir -p build/app/outputs/bundle/release
            cp android/app/build/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/app-release.aab
            ls -lh build/app/outputs/bundle/release/app-release.aab
          else
            echo "ERROR: app-release.aab not found in expected locations."
            if find . -path "*intermediary_bundle*" -name "*.aab" -print -quit | grep -q .; then
              echo "Only intermediary bundle was generated. Final signed app-release.aab is missing. Check Android release signing."
            fi
            echo "Build tree diagnostics:"
            find . -name "*.aab" -print
            exit 1
          fi

    artifacts:
      - build/app/outputs/bundle/release/app-release.aab

  production:
    name: Production
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: asc_rodizio_v3

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rodiziobrinquedos.v3

    scripts:
      - name: Clean Flutter and iOS cache
        script: |
          flutter clean
          rm -rf ios/Pods
          rm -f ios/Podfile.lock
          rm -rf ios/Runner.xcworkspace
          rm -rf ~/Library/Developer/Xcode/DerivedData/* || true

      - name: Pub get
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --archive-method app-store \
            --export-options-plist=/Users/builder/export_options.plist \
            --code-signing-setup-verbose-logging

      - name: Analyze
        script: flutter analyze --no-pub lib test

      - name: Test
        script: |
          if [ -d test ]; then
            flutter test
          else
            echo "No tests directory found. Skipping flutter test."
          fi

      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Upload Crashlytics dSYMs
        script: |
          set -e

          GOOGLE_SERVICE_PLIST="ios/Runner/GoogleService-Info.plist"
          DSYM_LIST="$(mktemp)"
          trap 'rm -f "$DSYM_LIST"' EXIT

          echo "Working directory:"
          pwd
          echo "Flutter version:"
          flutter --version
          echo "Dart version:"
          dart --version
          echo "iOS directory:"
          ls -la ios || true
          echo "iOS Pods directory:"
          ls -la ios/Pods || true
          echo "Crashlytics dependency lines before pod fallback:"
          grep -n "firebase_crashlytics\|FirebaseCrashlytics\|Crashlytics" pubspec.yaml ios/Podfile.lock || true
          echo "upload-symbols candidates before pod fallback:"
          find . -type f -name "upload-symbols" -print || true
          echo "Crashlytics-related files before pod fallback:"
          find . -iname "*Crashlytics*" -print || true

          echo "Ensuring Flutter and CocoaPods dependencies are available."
          flutter pub get
          if [ ! -d ios/Pods ] || [ ! -f ios/Podfile.lock ] || ! grep -q "FirebaseCrashlytics" ios/Podfile.lock || ! find . -type f -name "upload-symbols" -print -quit | grep -q .; then
            echo "Pods or Crashlytics upload-symbols are missing. Running pod install --repo-update as fallback."
            (cd ios && pod install --repo-update)
          fi

          echo "Crashlytics dependency lines after pod check:"
          grep -n "firebase_crashlytics\|FirebaseCrashlytics\|Crashlytics" pubspec.yaml ios/Podfile.lock || true
          echo "upload-symbols candidates after pod check:"
          find . -type f -name "upload-symbols" -print || true
          echo "Crashlytics run candidates after pod check:"
          find . -type f -name "run" | grep -i Crashlytics || true

          UPLOAD_SYMBOLS="$(find . -type f -name "upload-symbols" | head -n 1)"
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "upload-symbols not found in the repository. Checking CocoaPods caches."
            UPLOAD_SYMBOLS="$(find "$HOME/Library/Caches/CocoaPods" "$HOME/.cocoapods" -type f -path "*FirebaseCrashlytics*" -name "upload-symbols" -print 2>/dev/null | head -n 1 || true)"
          fi
          CRASHLYTICS_RUN="$(find . -type f -path "*FirebaseCrashlytics*run" | head -n 1)"
          echo "GoogleService-Info.plist: $GOOGLE_SERVICE_PLIST"

          if [ -z "$UPLOAD_SYMBOLS" ] && [ -z "$CRASHLYTICS_RUN" ]; then
            echo "ERROR: Firebase Crashlytics upload-symbols and run scripts were not found."
            echo "Podfile.lock Crashlytics lines:"
            grep -n "firebase_crashlytics\|FirebaseCrashlytics\|Crashlytics" ios/Podfile.lock || true
            echo "Firebase/Crashlytics files available:"
            find . -iname "*Crashlytics*" -print || true
            echo "upload-symbols candidates:"
            find . -type f -name "upload-symbols" -print || true
            echo "dSYM bundles currently available:"
            find build/ios -type d -name "*.dSYM" -print 2>/dev/null || true
            exit 1
          fi

          if [ -n "$UPLOAD_SYMBOLS" ]; then
            chmod +x "$UPLOAD_SYMBOLS" || true
            echo "Crashlytics upload-symbols found at: $UPLOAD_SYMBOLS"
          fi
          if [ -n "$CRASHLYTICS_RUN" ]; then
            chmod +x "$CRASHLYTICS_RUN" || true
            echo "Crashlytics run fallback found at: $CRASHLYTICS_RUN"
          fi

          if [ ! -f "$GOOGLE_SERVICE_PLIST" ]; then
            echo "ERROR: GoogleService-Info.plist not found at $GOOGLE_SERVICE_PLIST"
            exit 1
          fi

          echo "Inspecting iOS build output:"
          find build/ios -maxdepth 6 \( -name "*.xcarchive" -o -name "*.dSYM" -o -name "*.ipa" \) -print 2>/dev/null || true
          echo "All dSYM bundles under build/ios:"
          find build/ios -type d -name "*.dSYM" -print 2>/dev/null || true

          : > "$DSYM_LIST"
          for path in \
            build/ios/archive/*.xcarchive/dSYMs \
            build/ios/archive/Runner.xcarchive/dSYMs \
            build/ios/ipa \
            build/ios/Release-iphoneos
          do
            if [ -d "$path" ]; then
              find "$path" -type d -name "*.dSYM" -print >> "$DSYM_LIST"
            fi
          done
          find build/ios -type d -name "*.dSYM" -print >> "$DSYM_LIST" 2>/dev/null || true

          sort -u "$DSYM_LIST" -o "$DSYM_LIST"

          if [ ! -s "$DSYM_LIST" ]; then
            echo "ERROR: No dSYM bundles found after flutter build ipa."
            echo "Full build/ios tree for diagnostics:"
            find build/ios -maxdepth 6 -print 2>/dev/null || true
            exit 1
          fi

          echo "Found dSYMs:"
          cat "$DSYM_LIST"

          while IFS= read -r dsym; do
            echo "Uploading dSYM: $dsym"
            if [ -n "$UPLOAD_SYMBOLS" ]; then
              if "$UPLOAD_SYMBOLS" -gsp "$GOOGLE_SERVICE_PLIST" -p ios "$dsym"; then
                echo "Uploaded dSYM with upload-symbols: $dsym"
              else
                echo "ERROR: Crashlytics upload-symbols failed for dSYM: $dsym"
                exit 1
              fi
            else
              echo "upload-symbols is unavailable. Using Crashlytics run script fallback for: $dsym"
              export PODS_ROOT="$(pwd)/ios/Pods"
              export PLATFORM_NAME="iphoneos"
              export CONFIGURATION="Release"
              export DWARF_DSYM_FOLDER_PATH="$(dirname "$dsym")"
              export DWARF_DSYM_FILE_NAME="$(basename "$dsym")"
              export GOOGLE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "$GOOGLE_SERVICE_PLIST" 2>/dev/null || true)"
              if "$CRASHLYTICS_RUN" -gsp "$GOOGLE_SERVICE_PLIST" -p ios "$dsym"; then
                echo "Crashlytics run fallback completed for dSYM: $dsym"
              else
                echo "ERROR: Crashlytics run fallback failed for dSYM: $dsym"
                exit 1
              fi
            fi
          done < "$DSYM_LIST"

          echo "Crashlytics dSYM upload finished."

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - build/ios/archive/**/*.dSYM
      - build/ios/Release-iphoneos/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
